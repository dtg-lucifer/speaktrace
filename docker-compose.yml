services:
  postgres:
    image: postgres:16-alpine
    container_name: speaktrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: speaktrace_db
      POSTGRES_USER: piush
      POSTGRES_PASSWORD: root_123_allmighty
    ports:
      - "5432:5432"
    volumes:
      - speaktrace_pg_data:/var/lib/postgresql/data
    networks:
      - speaktrace_network

  redis:
    image: redis:7-alpine
    container_name: speaktrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - speaktrace_redis_data:/data
    networks:
      - speaktrace_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: speaktrace-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: speaktrace
      RABBITMQ_DEFAULT_PASS: speaktrace_pass
      RABBITMQ_DEFAULT_VHOST: speaktrace
    volumes:
      - speaktrace_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - speaktrace_network

  ollama:
    image: ollama/ollama:latest
    container_name: speaktrace-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - speaktrace_ollama_data:/root/.ollama
    networks:
      - speaktrace_network

  prometheus:
    image: prom/prometheus:latest
    container_name: speaktrace-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - speaktrace_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - speaktrace_network

  loki:
    image: grafana/loki:latest
    container_name: speaktrace-loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - speaktrace_loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - speaktrace_network

  promtail:
    image: grafana/promtail:latest
    container_name: speaktrace-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - ./api/logs:/app_logs/api:ro
      - ./ml/logs:/app_logs/ml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - speaktrace_network

  grafana:
    image: grafana/grafana:latest
    container_name: speaktrace-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      - GF_PLUGINS_CHECK_FOR_UPDATES=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - speaktrace_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - speaktrace_network

volumes:
  speaktrace_pg_data:
  speaktrace_redis_data:
  speaktrace_rabbitmq_data:
  speaktrace_ollama_data:
  speaktrace_prometheus_data:
  speaktrace_loki_data:
  speaktrace_grafana_data:

networks:
  speaktrace_network:
    driver: bridge
