[project]
name = "speaktrace-ml"
version = "0.1.0"
description = "SpeakTrace Machine Learning, Audio Diarization, Transcription, and LangChain RAG Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "aio-pika>=9.4.0",
    "httpx>=0.28.0",
    "cloudinary>=1.41.0",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "bullmq>=3.2.1",
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
