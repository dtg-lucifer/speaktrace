[project]
name = "agent-api"
version = "0.1.0"
description = "Production-grade LangChain agentic API — FastAPI + LangChain + Gemini + Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "langchain==0.3.13",
    "langchain-openai==0.2.14",
    "langchain-core==0.3.28",
    "openai==1.58.1",
    "httpx==0.28.1",
    "redis==5.2.1",
    "anyio==4.7.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "langchain-google-genai>=2.0.9",
    "aio-pika==9.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "off"
