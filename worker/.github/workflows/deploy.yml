name: Deploy to Production

on:
  push:
    branches:
      - main

# Cancel any in-progress deployment for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: lint, type-check ────────────────────────────────────────────────────
  ci:
    name: CI checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

  # ─── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Copy source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: ${{ secrets.APP_DIR }}
          # Never deploy the local venv — it's rebuilt on the server
          exclude: ".venv,__pycache__,**/__pycache__,**/*.pyc,.git,.github"

      - name: Install dependencies and restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            source /root/.bashrc
            set -e
            cd ${{ secrets.APP_DIR }}

            echo ">>> Syncing Python dependencies..."
            uv sync --no-dev

            echo ">>> Restarting with PM2..."
            pm2 reload ecosystem.config.json --env production \
              || pm2 start ecosystem.config.json --env production

            pm2 save

            echo ">>> Deploy complete!"

  # ─── Health check ────────────────────────────────────────────────────────────
  health-check:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for service to come up
        run: sleep 10

      - name: Check /health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            https://${{ secrets.DEPLOY_HOST }}/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Service is healthy!"
