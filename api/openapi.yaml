openapi: 3.0.0
info:
  version: 1.0.0
  title: Backend Template API
  description: Express + TypeScript backend API documentation
servers:
  - url: /api/v1
    description: API server
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
  parameters: {}
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                      tokens:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                        required:
                          - accessToken
                          - refreshToken
                    required:
                      - user
                      - tokens
                required:
                  - success
                  - message
                  - data
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  requestId:
                    type: string
                required:
                  - success
                  - message
  /health:
    get:
      tags:
        - Health
      summary: Health check — returns server status and metrics
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      timestamp:
                        type: string
                        example: 2026-05-29T10:00:00.000Z
                      uptime:
                        type: number
                        example: 345.67
                      dependencies:
                        type: object
                        properties:
                          database:
                            type: string
                            example: healthy
                        required:
                          - database
                      ping:
                        type: object
                        properties:
                          database:
                            type: number
                            example: 4
                          unit:
                            type: string
                            enum:
                              - ms
                        required:
                          - database
                          - unit
                    required:
                      - status
                      - timestamp
                      - uptime
                      - dependencies
                      - ping
                required:
                  - success
                  - data
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check — returns 200 if server dependencies are fully ready
      security: []
      responses:
        "200":
          description: Server dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      dependencies:
                        type: object
                        properties:
                          database:
                            type: string
                            example: healthy
                        required:
                          - database
                    required:
                      - status
                      - dependencies
                required:
                  - success
                  - data
        "503":
          description: Server dependencies are not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: unhealthy
                      dependencies:
                        type: object
                        properties:
                          database:
                            type: string
                            example: unhealthy
                        required:
                          - database
                    required:
                      - status
                      - dependencies
                required:
                  - success
                  - data
  /openapi.json:
    get:
      tags:
        - Health
      summary: Get OpenAPI specification as JSON
      security: []
      responses:
        "200":
          description: OpenAPI specification document
          content:
            application/json:
              schema:
                type: object
                properties: {}
                description: JSON specification complying with OpenAPI 3.0
  /users:
    get:
      tags:
        - Users
      summary: Get user by email
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: email
          required: true
          name: email
          in: query
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
  /users/me:
    get:
      tags:
        - Users
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                        required:
                          - id
                          - email
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                      - user
                required:
                  - success
                  - message
                  - data
