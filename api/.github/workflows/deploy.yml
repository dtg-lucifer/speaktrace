name: Deploy to Production

on:
  push:
    branches:
      - main

# Cancel any in-progress deployment for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which services changed ──────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      main-api: ${{ steps.filter.outputs.main-api }}
      llm-agent: ${{ steps.filter.outputs.llm-agent }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main-api:
              - 'main-api/**'
            llm-agent:
              - 'llm-agent/**'

  # ─── Deploy Node.js backend (main-api) ──────────────────────────────────────
  deploy-main-api:
    name: Deploy main-api (Node.js)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.main-api == 'true'

    defaults:
      run:
        working-directory: main-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Copy build artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "main-api/dist/,main-api/package.json,main-api/pnpm-lock.yaml,main-api/src/db/migrations/,main-api/ecosystem.config.json"
          target: ${{ secrets.APP_DIR }}
          strip_components: 1

      - name: Install, migrate and restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            source /root/.bashrc
            set -e
            cd ${{ secrets.MAIN_API_DIR }}

            echo ">>> Installing production dependencies..."
            pnpm install --prod --frozen-lockfile

            echo ">>> Running database migrations..."
            pnpm db:migrate

            echo ">>> Restarting main-api with PM2..."
            pm2 reload ecosystem.config.json --env production \
              || pm2 start ecosystem.config.json --env production

            pm2 save

            echo ">>> main-api deploy complete!"

  # ─── Deploy Python AI service (llm-agent) ───────────────────────────────────
  deploy-llm-agent:
    name: Deploy llm-agent (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.llm-agent == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy llm-agent source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "llm-agent/"
          target: ${{ secrets.APP_DIR }}
          # Exclude dev artifacts — .venv is rebuilt on the server
          exclude: "llm-agent/.venv,llm-agent/__pycache__,llm-agent/**/__pycache__,llm-agent/**/*.pyc"

      - name: Sync dependencies and restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            source /root/.bashrc
            set -e
            cd ${{ secrets.LLM_AGENT_DIR }}

            echo ">>> Syncing Python dependencies with uv..."
            uv sync --no-dev

            echo ">>> Restarting llm-agent with PM2..."
            pm2 reload ecosystem.config.json --env production \
              || pm2 start ecosystem.config.json --env production

            pm2 save

            echo ">>> llm-agent deploy complete!"

  # ─── Post-deploy health check ────────────────────────────────────────────────
  health-check:
    name: Health check
    runs-on: ubuntu-latest
    needs: [deploy-main-api, deploy-llm-agent]
    # Run if at least one deploy job ran (succeeded or was skipped)
    if: |
      always() &&
      (needs.deploy-main-api.result == 'success' || needs.deploy-main-api.result == 'skipped') &&
      (needs.deploy-llm-agent.result == 'success' || needs.deploy-llm-agent.result == 'skipped') &&
      (needs.deploy-main-api.result == 'success' || needs.deploy-llm-agent.result == 'success')

    steps:
      - name: Wait for services to come up
        run: sleep 15

      - name: Check main-api health
        if: needs.deploy-main-api.result == 'success'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            https://${{ secrets.DEPLOY_HOST }}/health || echo "000")
          echo "main-api health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::main-api health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Check llm-agent health
        if: needs.deploy-llm-agent.result == 'success'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            https://${{ secrets.DEPLOY_HOST }}/ai-service/health || echo "000")
          echo "llm-agent health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::llm-agent health check failed (HTTP $STATUS)"
            exit 1
          fi
