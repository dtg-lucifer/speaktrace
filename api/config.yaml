server:
    host: localhost
    port: 8989
    api_prefix: /api/v1
    environment: development

security:
    helmet:
        enabled: true
        content_security_policy: true
    cors:
        enabled: true
        origins:
            - http://localhost:3000
            - http://localhost:5173
    rate_limit:
        enabled: true
        window_ms: 900000
        max_requests: 100
        skip_localhost: true

database:
    pool_size: 10
    connection_timeout: 10000
    idle_timeout: 30000

logging:
    level: http
    format: simple
    enable_colors: true
    log_requests: true
    log_errors: true

middlewares:
    request_id:
        enabled: true
        header_name: X-Request-ID
    body_parser:
        enabled: true
        json_limit: 10mb
        urlencoded_limit: 10mb
    dependency_injection:
        enabled: true
    logger:
        enabled: true
    rate_limit:
        enabled: true
        window_ms: 1000
        max_requests: 5
        skip_localhost: true

documentation:
    swagger:
        enabled: true
        path: /docs
        openapi_file: openapi.yaml

realtime:
    socketio:
        enabled: true
        path: /ws

queues:
    bullmq:
        enabled: true
        default_attempts: 3
        default_backoff_ms: 1000

workers:
    process:
        enabled: false
    notification_jobs:
        enabled: false

rabbitmq:
    enabled: true
    url: amqp://localhost:5672
    exchange: speak_trace
    exchange_type: topic
    reconnect_delay_ms: 5000

cloudinary:
    max_file_size_mb: 100
