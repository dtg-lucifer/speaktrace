server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: speaktrace-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: speaktrace-api
          container: speaktrace-api
          app: speaktrace-api
          service: api
          __path__: /app_logs/api/*log

  - job_name: speaktrace-ml
    static_configs:
      - targets:
          - localhost
        labels:
          job: speaktrace-ml
          container: speaktrace-ml
          app: speaktrace-ml
          service: ml
          __path__: /app_logs/ml/*log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
